<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
    <!-- Definições de Estilo e Gradientes -->
    <defs>
        <!-- Gradiente para o Fundo Profissional -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
        </linearGradient>

        <!-- Padrão de Grade (Grid) de Tecnologia -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="0.5" stroke-opacity="0.05"/>
        </pattern>

        <!-- Filtro de Sombra para a Logo -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="0" dy="4" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.3" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Fundo Principal -->
    <rect width="100%" height="100%" fill="url(#bgGradient)" />
    
    <!-- Camada de Grade -->
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- LOGO CENTRALIZADA (UTI TECH) -->
    <g transform="translate(810, 340)" filter="url(#shadow)">
        <!-- Ícone de Monitor Estilizado em Branco -->
        <g transform="translate(75, 20) scale(1.2)">
            <rect x="0" y="20" width="150" height="110" rx="8" stroke="white" stroke-width="6" fill="none"/>
            <rect x="10" y="30" width="130" height="90" rx="4" fill="white" fill-opacity="0.05" stroke="white" stroke-width="1"/>
            <path d="M 50 130 L 40 160 L 110 160 L 100 130 Z" fill="none" stroke="white" stroke-width="6" stroke-linejoin="round"/>
            <path d="M 60 160 Q 75 175 90 160" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Símbolo de Código </> -->
            <path d="M 60 75 L 45 90 L 60 105" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 90 75 L 105 90 L 90 105" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="82" y1="70" x2="68" y2="110" stroke="white" stroke-width="5" stroke-linecap="round"/>
            
            <!-- Barra de ferramentas superior -->
            <circle cx="25" cy="40" r="3" fill="white"/>
            <circle cx="37" cy="40" r="3" fill="white"/>
            <circle cx="49" cy="40" r="3" fill="white"/>
            <line x1="65" y1="40" x2="135" y2="40" stroke="white" stroke-width="2"/>
        </g>
        
        <!-- Texto UTI TECH -->
        <text x="150" y="280" text-anchor="middle" font-family="Cinzel, serif" font-size="64" font-weight="600" fill="white">UTI TECH</text>
        
        <!-- Tagline -->
        <text x="150" y="330" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="300" fill="white" fill-opacity="0.7" style="letter-spacing: 4px; text-transform: uppercase;">Soluções em Tecnologia</text>
    </g>

    <!-- Detalhes Decorativos nos Cantos -->
    <circle cx="100" cy="100" r="150" fill="white" fill-opacity="0.02" />
    <circle cx="1820" cy="980" r="200" fill="white" fill-opacity="0.02" />
</svg>
